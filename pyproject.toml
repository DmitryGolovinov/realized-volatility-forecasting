[project]
name = "realized-volatility-forecasting"
version = "0.1.0"
description = "Realized volatility forecasting: cross-asset generalization and forecast combination"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5",
  "pyarrow>=16", "pyyaml>=6", "tabulate>=0.9", "matplotlib>=3.8", "torch>=2.2",
  "requests>=2.31",  # public crypto download (scripts/build_crypto_panel.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
dates = ["yfinance>=0.2"]   # optional: scripts/recover_dates.py (private stock calendar) only

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
